name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install ripgrep (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          if ! command -v rg; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-"
            sudo apt-get install -y ripgrep
          fi
      - name: Install ripgrep (macOS)
        if: matrix.os == 'macos-latest'
        run: command -v rg || brew install ripgrep
      - name: Install ripgrep (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: if (-not (Get-Command rg -ErrorAction SilentlyContinue)) { choco install -y ripgrep }
      - run: npm ci
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install ripgrep (Linux)
        run: |
          if ! command -v rg; then
            sudo apt-get update \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-"
            sudo apt-get install -y ripgrep
          fi
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          path: playwright-report/
          name: playwright-report
          retention-days: 7
